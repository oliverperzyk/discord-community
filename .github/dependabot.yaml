# Configuration of Dependabot, to automatically update libraries, images, etc.
---
version: 2
updates:
    - package-ecosystem: bun
      target-branch: development
      open-pull-requests-limit: 10
      directory: /
      assignees:
          - oliverperzyk
      labels:
          - 🔁 Dependencies
          - 🍞 Bun
      schedule:
          interval: quarterly
          timezone: Europe/Warsaw
      commit-message:
          prefix: chore(deps)
          prefix-development: chore(dev-deps)
    - package-ecosystem: docker
      target-branch: development
      open-pull-requests-limit: 10
      directory: /
      assignees:
          - oliverperzyk
      labels:
          - 🔁 Dependencies
          - 🐳 Docker
      schedule:
          interval: quarterly
          timezone: Europe/Warsaw
      commit-message:
          prefix: chore(dockerfile)
    - package-ecosystem: docker-compose
      target-branch: development
      open-pull-requests-limit: 10
      directory: /
      assignees:
          - oliverperzyk
      labels:
          - 🔁 Dependencies
          - 🐋 Docker Compose
      schedule:
          interval: quarterly
          timezone: Europe/Warsaw
      commit-message:
          prefix: chore(docker-compose)
    - package-ecosystem: github-actions
      target-branch: development
      open-pull-requests-limit: 10
      directory: /
      assignees:
          - oliverperzyk
      labels:
          - 🔁 Dependencies
          - 🦊 GitHub Workflows
      schedule:
          interval: quarterly
          timezone: Europe/Warsaw
      commit-message:
          prefix: chore(workflows)
