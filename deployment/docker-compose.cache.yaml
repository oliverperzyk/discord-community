# Configuration of cache container for the application.
# Caching engine is not required to run the application, but it's recommended for performance.
---
name: oliverperzyk-discord-deployment
services:
    discord-application:
        depends_on:
            cache:
                condition: service_healthy
    cache:
        container_name: oliverperzyk-discord-redis
        image: redis:8.0-alpine
        restart: unless-stopped
        init: true
        env_file:
            - .env
        environment:
            CACHE_URL: ${CACHE_URL:-redis://localhost:${CACHE_ENGINE_PORT:-6379}}
        ports:
            - "${CACHE_ENGINE_PORT:-6379}:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 30s
            timeout: 5s
            start_period: 15s
            retries: 3
        networks:
            - app-network
