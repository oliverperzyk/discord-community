# General configuration of the application.
---
networks:
    app-network:
        name: oliverperzyk-discord-community-network
        driver: bridge
services:
    discord-application:
        container_name: oliverperzyk-discord-community
        restart: unless-stopped
        init: true
        build:
            context: .
            dockerfile: Dockerfile
        env_file:
            - .env
        environment:
            NODE_ENV: ${NODE_ENV:-production}
        healthcheck:
            test: ["CMD", "bun", "-e", "process.exit(0)"]
            interval: 30s
            timeout: 5s
            start_period: 15s
            retries: 3
        networks:
            - app-network
