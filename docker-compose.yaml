# General configuration of the application.
---
networks:
    discord-application-network:
        name: oliverperzyk-discord-community-network
        driver: bridge
services:
    discord-application:
        container_name: oliverperzyk-discord-community
        build:
            context: .
            dockerfile: Dockerfile
            args:
                APP_PORT: ${APP_PORT:-3000}
        env_file:
            - .env
        environment:
            NODE_ENV: ${NODE_ENV:-production}
        ports:
          - ${APP_PORT:-3000}:${APP_PORT:-3000}
        networks:
            - discord-application-network